[verify]
commands = [
  "bash .verify/checks/route_drift.sh",
  "cargo test",
  "cargo clippy -- -D warnings",
  "cargo check",
  "sh .verify/checks/require_tests.sh",
  ".verify/playbooks/verify_full_suite.sh",
  ".verify/playbooks/verify_usage_stream.sh",
  ".verify/playbooks/verify_backpressure.sh",
]

[verify.default]
command = ["cargo", "test"]
timeout_secs = 600
